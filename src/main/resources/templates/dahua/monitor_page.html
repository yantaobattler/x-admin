	<script src="../js/dhflv.min.js"></script>
	<script src="../js/dhhls.min.js"></script>
	<script>
	/*
	如何在浏览器观看视频
	> 首先确定要观看视频的通道号。常用方式有两种
	>
	> a) 如果能访问视频云的管理界面，在`设备`页面通过`导出`按钮，得到通道列表。
	>
	> b) 通过  **基础服务->设备管理->获取设备树**  接口获得通道列表。
	>
	> c) 通过  **视频服务->实时预览->获取实时预览URI** 接口获得实时预览地址，送浏览器播放。

	*/
	if ( !dhflvjs.isSupported() ) {alert("浏览器不支持 FLV, 请升级！");}
	if ( !Hls.isSupported() )   {alert("浏览器不支持 HLS, 请升级！");}

	function startPlay(dc){
	   var urls= $(dc).parent().siblings().val();
	   var video= $(dc).parent().parent().siblings("video")[0] || $(dc).parent().parent().siblings().find(":first-child")[0];
	  if(!video || video.localName !== "video") {
		console.log("video元素获取失败");
		return
	  }
	  play(urls,video);
	}
	
	function isHlsFlv(url){
		 var extension=url.substring(url.lastIndexOf('.')+1);

		if(url.includes("m3u8")){
			return "hls";
		}
		if(url.includes("flv")){
			return "flv";
		}
		return "";
	}
	function play(url,video){
		 if ('hls' == isHlsFlv(url)) {
			var myPlayer = new Hls();
			myPlayer.loadSource(url);
			myPlayer.attachMedia(video);
			myPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
				video.play(); }
			);
		
		}else if ('flv' == isHlsFlv(url)) {
			var myPlayer = dhflvjs.createPlayer({
				type: 'flv',
				url : url
			});
			myPlayer.attachMediaElement(video);
			myPlayer.load();
			myPlayer.play();
			

		 }else{
		 
			console.log("错误类型地址")
		 }
	}


	function playVideo(){
	  if ('HLS' == $('#videoType').val()) {
		playhls();
	  } else {
		playflv();
	  }
	}

	function playhls() {
		var video = document.getElementById("myVideo");
		var myPlayer = new Hls();

		myPlayer.loadSource( $('#url').val() );
		myPlayer.attachMedia(video);
		myPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
			video.play(); }
		);
	}

	function playflv() {
		var video = document.getElementById("myVideo");
		var myPlayer = dhflvjs.createPlayer({
			type: 'flv',
			url : $('#url').val()
		});
		myPlayer.attachMediaElement(video);
		myPlayer.load();
		myPlayer.play();
	}
	function showHidden(dc){
		$('.col-sm-6').children("div").hide();
		$(dc).children("div").show()
		
	}
	$('.1col-sm-6').hover(function(){
			$(this).children("div").show()
		},
		function(){
			$(this).children("div").hide()
		}
	)
	function hidden(){
		$('.col-sm-6').children("div").hide()
	}
	// setInterval('hidden();', 10000);


	</script>
