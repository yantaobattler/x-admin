	/*
	如何在浏览器观看视频

	var playerList = []

	function playerUrls() {
		// 清空原有数据
		$("#playerwrapper").empty()
		playerList.forEach(function (item) {
			item.destroy()
		})
		playerList = []
		var intervalTime = parseInt($("#intervalTime").val())
		// 读取地址列表数据
		try {
			hlsUrls = JSON.parse($("#hlsUrlsText").val())
			//console.log(hlsUrls)
		} catch(e) {
			alert("请输入Json格式的HLS地址数组")
		}
		// 构造播放器
		hlsUrls.forEach(function (item, index) {
			var playerObj = {
				index: index,
				playerDom:$(`<div class="col-sm-6 video-sm" style="padding-right: 2px;padding-left: 2px;margin-bottom: 2px;" onclick="showHidden(this)" >
					<video width=200 height=150 id="video${index}" class="img-responsive video-js vjs-default-skin" controls preload="auto" autoplay="false"></video>
					<div class="input-group" style="padding-top: 5px;">
						<input type="text" value=""  placeholder="请输入hls或flv地址" class="form-control">
						<span class="input-group-addon">
							<a class="plbtn" href="javascript:void(0);" onclick="startPlay(this)">
								<span class="glyphicon glyphicon-play"></span>
							</a>
						</span>
					</div>
				</div>`) , //$(template),
				createTime: Date.now(),
				hlsUrl: item,
				timer: null,
				destroy: function() {
					window.clearInterval(this.timer)
					this.player.destroy()
				},
				startPlay: function () {
					$("#playerwrapper").append(this.playerDom[0])
					$("input", this.playerDom[0]).val(this.hlsUrl)

					var that = this
					var url = this.hlsUrl
					var video = $("video", this.playerDom[0])[0]
					this.player = play(url, video)

					this.timer = setInterval(function () {
						//console.log("重新拉流", that.index)
						// debugger
						that.player.destroy()
						that.player = play(url, video)
					}, intervalTime * 60 * 1000)
				}
			}
			playerList.push(playerObj)
			playerObj.startPlay()
		})
	}

	// 打开自动播放
	//playerUrls()

	function startPlay(dc){
	   	var urls= $(dc).parent().siblings().val();
	   	var video=  $(dc).parent().parent().siblings("video")[0] || $(dc).parent().parent().siblings().find(":first-child")[0];;
		play(urls, video);
	}
	
	function isHlsFlv(url){
		 var extension=url.substring(url.lastIndexOf('.')+1);

		if(url.includes("m3u8")){
			return "hls";
		}
		if(url.includes("flv")){
			return "flv";
		}
		return "";
	}
	function play(url, video){
		 if ('hls' == isHlsFlv(url)) {
			var myPlayer = new Hls();
			myPlayer.config.manifestLoadingTimeOut = 30 * 1000
			myPlayer.loadSource(url);
			myPlayer.attachMedia(video);
			myPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
				// setTimeout(() => {
				// 	video.play(); 
				// }, 1000)
			});
			return myPlayer
		}else if ('flv' == isHlsFlv(url)) {
			var myPlayer = dhflvjs.createPlayer({
				type: 'flv',
				url : url
			});
			myPlayer.attachMediaElement(video);
			myPlayer.load();
			myPlayer.play();
			return myPlayer
		 }else{
			console.log("错误类型地址")
		 }
	}


	function playVideo(){
	  if ('HLS' == $('#videoType').val()) {
		playhls();
	  } else {
		playflv();
	  }
	}

	function playhls() {
		var video = document.getElementById("myVideo");
		var myPlayer = new Hls();

		myPlayer.loadSource( $('#url').val() );
		myPlayer.attachMedia(video);
		myPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
			video.play(); }
		);
	}

	function playflv() {
		var video = document.getElementById("myVideo");
		var myPlayer = dhflvjs.createPlayer({
			type: 'flv',
			url : $('#url').val()
		});
		myPlayer.attachMediaElement(video);
		myPlayer.load();
		myPlayer.play();
	}
	function showHidden(dc){
		$('.col-sm-6').children("div").hide();
		$(dc).children("div").show()
		
	}
	$('.1col-sm-6').hover(function(){
			$(this).children("div").show()
		},
		function () {
			$(this).children("div").hide()
		}
